<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tidak Ada Koneksi — HRIS</title>
    <!--
      File statis MURNI — sengaja TIDAK pakai Tailwind/build step apa pun
      (folder public/ tidak diproses Next.js), karena halaman ini harus
      tetap bisa dirender service worker walau seluruh jaringan mati total.
      Dicache saat service worker install (lihat public/sw.js), disajikan
      sebagai fallback tiap kali navigasi gagal karena offline.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #172554;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 9999px;
        background: rgba(23, 37, 84, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 28px; height: 28px; }
      h1 {
        margin: 4px 0 0;
        font-size: 20px;
        font-weight: 600;
        color: #111111;
      }
      p {
        margin: 8px 0 0;
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        appearance: none;
        border: none;
        border-radius: 10px;
        background: #172554;
        color: #ffffff;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover { background: #1e2f6e; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#172554" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>Tidak Ada Koneksi Internet</h1>
      <p>
        Halaman ini butuh koneksi internet untuk memuat data HRIS terbaru.
        Periksa koneksi Wi-Fi/data seluler Anda, lalu coba lagi.
      </p>
      <button onclick="window.location.reload()">Coba Lagi</button>
    </div>
  </body>
</html>
