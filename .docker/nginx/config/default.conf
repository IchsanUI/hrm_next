# Beda dari template asli (yang fastcgi_pass ke PHP-FPM) — Next.js jalan
# sebagai server HTTP sendiri di port 3000 (lihat .docker/app/Dockerfile),
# jadi nginx-nya jadi REVERSE PROXY, bukan FastCGI passthrough. Container
# ini share network namespace dengan container "app" (network_mode:
# service:app di docker-compose.yml), makanya "localhost:3000" di sini
# mengarah ke Next.js, bukan ke nginx itu sendiri.
server {
    listen 80;
    listen 443 ssl;

    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    ssl_certificate /etc/ssl/private/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
