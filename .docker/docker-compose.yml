# Docker Compose production — hasil adaptasi dari Docker-Template
# (Nginx + PHP-FPM + MariaDB), service "php" diganti total jadi service
# "app" berbasis Node/Next.js. Lihat .docker/README.md buat panduan lengkap.
#! TODO: ganti nama project kalau perlu
name: hrm-next-production

services:
  app:
    env_file: .env
    build:
      context: ../
      dockerfile: .docker/app/Dockerfile
    # Port host dideklarasikan DI SINI (bukan di service nginx) — Docker
    # menolak `ports:` pada service yang pakai `network_mode: service:X`
    # ("conflicting options: port publishing and the container type network
    # mode"), karena service itu tidak punya network stack sendiri untuk
    # dipetakan. app-lah pemilik network stack-nya (nginx & mariadb cuma
    # menumpang lewat network_mode: service:app di bawah), jadi port 80/443
    # yang sebenarnya dibuka nginx DI DALAM network stack yang sama ini
    # dipetakan ke host lewat sini.
    # SENGAJA bukan 80/443 default — server ini sudah menjalankan banyak
    # container lain (lihat catatan di README), dan salah satu (SIBG-nginx)
    # kemungkinan pakai network_mode: host sehingga bisa saja sudah
    # memegang 80/443 langsung tanpa kelihatan di `docker ps`. Ganti nilai
    # host (angka sebelum ":") kalau 8085/8444 ternyata juga bentrok.
    ports:
      - "8085:80"
      - "8444:443"
    volumes:
      # Backup database (lib/backup/run-backup.ts) & upload foto/dokumen
      # (lib/file-upload.ts) — HARUS persisten, jangan sampai hilang tiap
      # container di-rebuild.
      - app_storage_backups:/app/storage/backups
      - app_public_uploads:/app/public/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    restart: unless-stopped

  nginx:
    env_file: .env
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/config:/etc/nginx/conf.d/
      - ./nginx/data/log:/var/log/nginx
      - ./nginx/data/ssl:/etc/ssl/private
    restart: unless-stopped
    depends_on:
      - app
    # Sama seperti trik di template asli — nginx "menumpang" network
    # namespace container app, jadi proxy_pass di default.conf bisa pakai
    # localhost:3000 buat menjangkau Next.js.
    network_mode: service:app

  mariadb:
    image: mariadb:10.11
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/data/log:/var/log/mysql
      - ./mariadb/config/my.cnf:/etc/mysql/conf.d/my.cnf
    restart: unless-stopped
    depends_on:
      - app
    network_mode: service:app

volumes:
  app_storage_backups:
    driver: local
  app_public_uploads:
    driver: local
  mariadb_data:
    driver: local
