# Docker Compose production — hasil adaptasi dari Docker-Template
# (Nginx + PHP-FPM + MariaDB), service "php" diganti total jadi service
# "app" berbasis Node/Next.js. Lihat .docker/README.md buat panduan lengkap.
#! TODO: ganti nama project kalau perlu
name: hrm-next-prod

services:
  app:
    env_file: .env
    build:
      context: ../
      dockerfile: .docker/app/Dockerfile
      args:                                          # ← TAMBAH INI
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    ports:
      - "10.100.0.10:8086:80"
      - "10.100.0.10:3307:3306"
    volumes:
      # Backup database (lib/backup/run-backup.ts) & upload foto/dokumen
      # (lib/file-upload.ts) — HARUS persisten, jangan sampai hilang tiap
      # container di-rebuild.
      - app_storage_backups:/app/storage/backups
      - app_public_uploads:/app/public/uploads
      # Dokumen pribadi pegawai (KTP/KK/NPWP/Surat Nikah-Cerai/Akta
      # Kelahiran) — SENGAJA volume terpisah dari app_public_uploads
      # (lib/employee-document-storage.ts, di luar public/) karena isinya
      # jauh lebih sensitif, cuma bisa diunduh lewat route yang wajib login.
      - app_storage_dokumen_pegawai:/app/storage/dokumen-pegawai
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    restart: unless-stopped
    networks:
      - proxy-net

  nginx:
    env_file: .env
    build:
      context: ./nginx
      dockerfile: Dockerfile
    volumes:
      - ./nginx/config:/etc/nginx/conf.d/
      - ./nginx/data/log:/var/log/nginx
      - ./nginx/data/ssl:/etc/ssl/private
    restart: unless-stopped

    depends_on:
      - app
    # Sama seperti trik di template asli — nginx "menumpang" network
    # namespace container app, jadi proxy_pass di default.conf bisa pakai
    # localhost:3000 buat menjangkau Next.js.
    network_mode: service:app

  mariadb:
    image: mariadb:10.11
    env_file: .env
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/data/log:/var/log/mysql
      - ./mariadb/config/my.cnf:/etc/mysql/conf.d/my.cnf
    restart: unless-stopped
    depends_on:
      - app
    network_mode: service:app

volumes:
  app_storage_backups:
    driver: local
  app_public_uploads:
    driver: local
  app_storage_dokumen_pegawai:
    driver: local
  mariadb_data:
    driver: local
networks:                                            # ← TAMBAH INI
  proxy-net:
    name: proxy-net
    external: true
